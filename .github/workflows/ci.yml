name: CI — Full Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint + Test + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache pip dependencies keyed by requirements.txt hash.
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Lint with flake8
        run: |
          flake8 app/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=.venv,__pycache__ \
            --statistics
        continue-on-error: true

      - name: Train classifier model
        run: python -m app.ml.train

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
        continue-on-error: true
        # No GROQ_API_KEY set — tests validate the fallback path automatically
        env:
          DATABASE_URL: sqlite:///./test_support.db

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
